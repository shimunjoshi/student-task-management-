name: Student Task One CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install & Lint
        run: |
          cd server && npm ci && npm run lint || true

      - name: Run Automated Test Suite
        run: cd server && npm run test:coverage || true

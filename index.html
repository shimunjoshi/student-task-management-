<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task One - Centralized Academic Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- AUTHENTICATION CONTAINER -->
    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card">
            <h2>Student Task One 🚀</h2>
            <p class="subtitle">Centralized Academic Task & Deadline Management Platform</p>
            
            <div class="tabs">
                <button id="tabLoginBtn" class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button id="tabRegisterBtn" class="tab-btn" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
                <input type="email" id="loginEmail" placeholder="University Email (e.g. student@avantika.edu.in)" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="btn-primary">Secure Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" style="display:none;" onsubmit="handleRegister(event)">
                <input type="text" id="regFullName" placeholder="Full Name (e.g. Shimun Joshi)" required>
                <input type="email" id="regEmail" placeholder="University Email" required>
                <input type="password" id="regPassword" placeholder="Password (min 8 chars)" required>
                <select id="regRole">
                    <option value="STUDENT">Student</option>
                    <option value="FACULTY">Faculty Coordinator</option>
                </select>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTAINER (Visible after login) -->
    <div id="dashboardContainer" class="dashboard-wrapper" style="display:none;">
        <header class="app-header">
            <div>
                <h1>Student Task One 🚀</h1>
                <p>Welcome back, <span id="userNameDisplay">Student</span>! Manage your coursework and deadlines efficiently.</p>
            </div>
            <button onclick="handleLogout()" class="btn-logout">Logout</button>
        </header>

        <main class="main-container">
            <!-- Add Task Form -->
            <section class="task-form-section">
                <h2>Create Academic Task</h2>
                <form id="taskForm" onsubmit="handleCreateTask(event)">
                    <input type="text" id="taskTitle" placeholder="Task Title (e.g., MCA1005 Lab Submission)" required>
                    <select id="taskCourse">
                        <option value="MCA1005">MCA1005 - Software Engineering LAB</option>
                        <option value="MCA1002">MCA1002 - Advanced Database Management</option>
                        <option value="MCA1003">MCA1003 - Web Technologies</option>
                        <option value="MCA1004">MCA1004 - Project Management</option>
                    </select>
                    <select id="taskPriority">
                        <option value="LOW">Low Priority</option>
                        <option value="MEDIUM" selected>Medium Priority</option>
                        <option value="HIGH">High Priority</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                    <input type="date" id="taskDueDate" required>
                    <button type="submit" class="btn-primary">Add Task</button>
                </form>
            </section>

            <!-- Interactive Kanban Board -->
            <section class="kanban-board">
                <div class="kanban-column" data-status="TODO">
                    <h3>To Do (<span count-status="TODO">0</span>)</h3>
                    <div class="task-list" id="list-TODO"></div>
                </div>
                <div class="kanban-column" data-status="IN_PROGRESS">
                    <h3>In Progress (<span count-status="IN_PROGRESS">0</span>)</h3>
                    <div class="task-list" id="list-IN_PROGRESS"></div>
                </div>
                <div class="kanban-column" data-status="REVIEW">
                    <h3>Review (<span count-status="REVIEW">0</span>)</h3>
                    <div class="task-list" id="list-REVIEW"></div>
                </div>
                <div class="kanban-column" data-status="COMPLETED">
                    <h3>Completed (<span count-status="COMPLETED">0</span>)</h3>
                    <div class="task-list" id="list-COMPLETED"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
